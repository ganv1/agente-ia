
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agente IA - Frontend</title>
</head>
<body>
    <h1>Agente IA en Render</h1>

    <!-- Botón para probar conexión -->
    <button onclick="probarConexion()">Probar conexión</button>
    <p id="pingResult"></p>

    <!-- Subir PDF -->
    <h2>Subir PDF</h2>
    <input type="file" id="pdfFile" accept=".pdf">
    <button onclick="subirPDF()">Subir PDF</button>
    <pre id="pdfResult"></pre>

    <!-- Subir CSV -->
    <h2>Subir CSV</h2>
    <input type="file" id="csvFile" accept=".csv">
    <button onclick="subirCSV()">Subir CSV</button>
    <pre id="csvResult"></pre>

    <!-- Consultar Gemini -->
    <h2>Consulta a Gemini</h2>
    <input type="text" id="pregunta" placeholder="Escribe tu pregunta">
    <button onclick="consultarGemini()">Consultar Gemini</button>
    <pre id="geminiResult"></pre>

    <script>
        // URL pública de tu backend en Render
        const BASE_URL = "https://agente-ia.onrender.com";

        async function probarConexion() {
            try {
                const response = await fetch(`${BASE_URL}/`);
                const data = await response.json();
                document.getElementById("pingResult").innerText = JSON.stringify(data);
            } catch (error) {
                alert("Error al conectar: " + error);
            }
        }

        async function subirPDF() {
            const fileInput = document.getElementById("pdfFile");
            if (!fileInput.files.length) {
                alert("Selecciona un archivo PDF primero");
                return;
            }
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch(`${BASE_URL}/subir-pdf`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                document.getElementById("pdfResult").innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                alert("Error al subir PDF: " + error);
            }
        }

        async function subirCSV() {
            const fileInput = document.getElementById("csvFile");
            if (!fileInput.files.length) {
                alert("Selecciona un archivo CSV primero");
                return;
            }
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch(`${BASE_URL}/consultar-csv`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                document.getElementById("csvResult").innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                alert("Error al subir CSV: " + error);
            }
        }

        async function consultarGemini() {
            const pregunta = document.getElementById("pregunta").value;
            if (!pregunta) {
                alert("Escribe una pregunta primero");
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/consultar-gemini`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ pregunta })
                });
                const data = await response.json();
                document.getElementById("geminiResult").innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                alert("Error al consultar Gemini: " + error);
            }
        }
    </script>
</body>
</html>
