<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agente IA</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #2c3e50; }
        .resultado {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            white-space: pre-wrap; /* mantiene saltos de línea */
        }
    </style>
</head>
<body>
    <h2>Subir PDF</h2>
    <form id="form-pdf" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Enviar PDF</button>
    </form>

    <h2>Consultar Gemini</h2>
    <form id="form-gemini">
        <input type="text" name="pregunta" placeholder="Escribe tu consulta..." required>
        <button type="submit">Consultar Gemini</button>
    </form>

    <div id="respuesta" class="resultado"></div>

    <script>
        // Subir PDF
        document.getElementById("form-pdf").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch("/subir-pdf", { method: "POST", body: formData });
            const data = await res.json();
            document.getElementById("respuesta").innerText = data.status || JSON.stringify(data);
        });

        // Consultar Gemini
        document.getElementById("form-gemini").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const pregunta = formData.get("pregunta");
            const res = await fetch("/consultar-gemini", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ pregunta })
            });
            const data = await res.json();
            // Mostrar solo el resumen limpio
            document.getElementById("respuesta").innerText = data.respuesta || data.error || JSON.stringify(data);
        });
    </script>
</body>
</html>
