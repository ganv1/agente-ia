<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agente IA Documentos</title>
</head>
<body>
  <h1>Agente IA - Resumen de Documentos</h1>

  <!-- Subir archivo -->
  <h2>Subir documento</h2>
  <form id="uploadForm">
    <input type="file" id="fileInput" name="file" />
    <button type="submit">Subir</button>
  </form>
  <p id="uploadStatus"></p>

  <!-- Seleccionar archivo y consultar -->
  <h2>Consultar documento</h2>
  <label for="archivoSelect">Elige un archivo:</label>
  <select id="archivoSelect"></select>

  <br><br>
  <label for="preguntaInput">Pregunta:</label>
  <input type="text" id="preguntaInput" placeholder="Ej: Resume este documento en 7 líneas" />

  <button id="consultarBtn">Consultar Gemini</button>

  <h3>Respuesta:</h3>
  <div id="respuesta"></div>

  <script>
    // Subir archivo
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("fileInput");
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      const res = await fetch("/subir-pdf", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      document.getElementById("uploadStatus").innerText = data.status || data.error;

      // Agregar archivo al select
      if (data.filename) {
        const select = document.getElementById("archivoSelect");
        const option = document.createElement("option");
        option.value = data.filename;
        option.text = data.filename;
        select.appendChild(option);
      }
    });

    // Consultar Gemini
    document.getElementById("consultarBtn").addEventListener("click", async () => {
      const archivo = document.getElementById("archivoSelect").value;
      const pregunta = document.getElementById("preguntaInput").value;

      const res = await fetch("/consultar-gemini", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ archivo, pregunta })
      });
      const data = await res.json();
      document.getElementById("respuesta").innerHTML = data.respuesta || data.error;
    });
  </script>
</body>
</html>
